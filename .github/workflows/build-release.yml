name: Build Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      upload_play_store:
        description: 'Upload to Play Store Internal Testing?'
        required: false
        default: false
        type: boolean
      distribute_firebase:
        description: 'Distribute via Firebase App Distribution?'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*.html
          retention-days: 14

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always() && (needs.test.result == 'success' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create debug keystore for CI
        run: |
          keytool -genkey -v             -keystore debug.keystore             -alias androiddebugkey             -storepass android             -keypass android             -keyalg RSA             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"
        working-directory: ${{ github.workspace }}

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "Release keystore decoded"
          else
            echo "No release keystore — using debug signing"
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "my-upload-key.jks" ] && [ -n "$STORE_PASSWORD" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleRelease --stacktrace               -Pandroid.injected.signing.store.file=${{ github.workspace }}/debug.keystore               -Pandroid.injected.signing.store.password=android               -Pandroid.injected.signing.key.alias=androiddebugkey               -Pandroid.injected.signing.key.password=android
          fi

      - name: Build Release AAB (for Play Store)
        if: github.event.inputs.upload_play_store == 'true' || startsWith(github.ref, 'refs/tags/v')
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "my-upload-key.jks" ] && [ -n "$STORE_PASSWORD" ]; then
            ./gradlew bundleRelease --stacktrace
          else
            ./gradlew bundleRelease --stacktrace               -Pandroid.injected.signing.store.file=${{ github.workspace }}/debug.keystore               -Pandroid.injected.signing.store.password=android               -Pandroid.injected.signing.key.alias=androiddebugkey               -Pandroid.injected.signing.key.password=android
          fi

      - name: Rename APK with version
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/' | tr -d ' ')
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d)

          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk                app/build/outputs/apk/release/AgeOfDAV-v${VERSION}-${DATE}-${COMMIT}.apk
            echo "apk_path=app/build/outputs/apk/release/AgeOfDAV-v${VERSION}-${DATE}-${COMMIT}.apk" >> $GITHUB_ENV
            echo "apk_name=AgeOfDAV-v${VERSION}-${DATE}-${COMMIT}.apk" >> $GITHUB_ENV
          fi

          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab                app/build/outputs/bundle/release/AgeOfDAV-v${VERSION}-${DATE}-${COMMIT}.aab
            echo "aab_path=app/build/outputs/bundle/release/AgeOfDAV-v${VERSION}-${DATE}-${COMMIT}.aab" >> $GITHUB_ENV
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.apk_name }}
          path: ${{ env.apk_path }}
          retention-days: 30

      - name: Upload AAB Artifact
        if: env.aab_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: AgeOfDAV-AAB
          path: ${{ env.aab_path }}
          retention-days: 30

      - name: Upload Build Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/
          retention-days: 7

  firebase-distribution:
    name: Firebase App Distribution
    needs: build
    runs-on: ubuntu-latest
    if: (github.event.inputs.distribute_firebase == 'true' || startsWith(github.ref, 'refs/tags/v')) && needs.build.result == 'success'
    timeout-minutes: 10

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: artifacts/**/*.apk
          releaseNotes: |
            Build: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}

  play-store:
    name: Play Store Upload
    needs: build
    runs-on: ubuntu-latest
    if: (github.event.inputs.upload_play_store == 'true' || startsWith(github.ref, 'refs/tags/v')) && needs.build.result == 'success'
    timeout-minutes: 15

    steps:
      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: AgeOfDAV-AAB
          path: aab/

      - name: Upload to Play Store Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.example.ageofdav
          releaseFiles: aab/*.aab
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew

  release:
    name: Create GitHub Release
    needs: [test, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success' && needs.build.result == 'success'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
